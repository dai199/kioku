name: Kioku
options:
  createIntermediateGroups: true
  deploymentTarget:
    macOS: "26.0"
packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift
    from: "7.0.0"
targets:
  Kioku:
    type: application
    platform: macOS
    sources:
      - Sources/Kioku
      - path: Assets
        buildPhase: resources
    dependencies:
      - package: GRDB
    info:
      path: Sources/Kioku/Info.plist
      properties:
        CFBundleDisplayName: Kioku
        CFBundleIconFile: Kioku
        # メニューバー常駐アプリ（Dockアイコン・アプリスイッチャーに出さない）
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Daiki Tagami"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daikitagami.kioku
        # 署名は固定しない。特定のTeam IDを直書きすると他の人のビルドが通らない。
        # 既定はad-hoc署名（Apple Siliconでは無署名だと起動できないため最低限必要）。
        # 自分の証明書で署名するなら `make build TEAM=XXXXXXXXXX` で上書きする。
        # 署名が安定するとアクセシビリティ権限が更新後も保持されるので、
        # 継続して使うなら自分のTeam IDを渡すほうが快適
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_REQUIRED: YES
        CODE_SIGNING_ALLOWED: YES
        SWIFT_VERSION: "6.0"
        # Accessibility APIを使うためApp Sandboxは無効（entitlementsなし）
        ENABLE_HARDENED_RUNTIME: false
    # `xcodebuild -scheme Kioku test` でユニットテストが走るようにする
    scheme:
      testTargets:
        - KiokuTests
        - KiokuUITests

  # 純粋ロジック（選択フィルタ・言語判定・SRSスケジューラ・JSON抽出）のテスト。
  # AX APIやネットワークに触れる層はテスト対象にしていない
  KiokuTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/KiokuTests
    dependencies:
      - target: Kioku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daikitagami.kioku.tests
        DEVELOPMENT_TEAM: C8FHUZ27C7
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true

  # スクリーンショット撮影用。実アプリを操作して撮るので、ユニットテストとは分ける
  # （遅く、環境に依存する）。make screenshots からのみ回す
  KiokuUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - Tests/KiokuUITests
    dependencies:
      - target: Kioku
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.daikitagami.kioku.uitests
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: true
